<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Workshop</title>
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="320" height="480"></canvas>
        
        <div id="ui-layer">
            <div id="score-display">0</div>
            <div id="currency-wrapper">⚙️ <span id="coins">0</span></div>
            <button id="shop-open-btn" onclick="toggleShop(true)">🛠️ Workshop</button>
        </div>

        <div id="death-screen" class="overlay hidden">
            <h1 class="glitch">CRASHED</h1>
            <div class="stats">
                <p>SCORE: <span id="final-score">0</span></p>
                <p>BEST: <span id="high-score">0</span></p>
            </div>
            <button class="main-btn" onclick="resetGame()">FLY AGAIN</button>
            <button class="sec-btn" onclick="toggleShop(true)">VISIT SHOP</button>
        </div>

        <div id="shop-screen" class="overlay hidden">
            <h2>THE WORKSHOP</h2>
            <div class="shop-tabs">
                <button onclick="showTab('tab-birds')">BIRDS</button>
                <button onclick="showTab('tab-themes')">MAPS</button>
            </div>

            <div id="tab-birds" class="tab-content">
                <div class="grid" id="bird-grid"></div>
            </div>
            <div id="tab-themes" class="tab-content hidden">
                <div class="grid" id="theme-grid"></div>
            </div>

            <button class="close-btn" onclick="toggleShop(false)">CLOSE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game State
        let score = 0;
        let coins = parseInt(localStorage.getItem('birdCoins')) || 0;
        let highScore = parseInt(localStorage.getItem('birdHighScore')) || 0;
        let unlocked = JSON.parse(localStorage.getItem('birdUnlocked')) || ['b-classic', 't-classic'];
        let activeBird = localStorage.getItem('birdActive') || 'b-classic';
        let activeTheme = localStorage.getItem('themeActive') || 't-classic';

        // 10 Themes Configuration
        const birdSkins = {
            'b-classic': { color: '#f4d03f', price: 0, name: 'Default' },
            'b-robotic': { color: '#bdc3c7', price: 20, name: 'Silver' },
            'b-stealth': { color: '#2c3e50', price: 50, name: 'Stealth' },
            'b-gold': { color: '#f1c40f', price: 100, name: 'Royal' },
            'b-toxic': { color: '#2ecc71', price: 150, name: 'Toxic' }
        };

        const themes = {
            't-classic': { bg: '#70c5ce', pipe: '#2ecc71', price: 0, name: 'Day' },
            't-night': { bg: '#2c3e50', pipe: '#34495e', price: 30, name: 'Night' },
            't-mars': { bg: '#e67e22', pipe: '#a04000', price: 60, name: 'Mars' },
            't-void': { bg: '#000000', pipe: '#4b0082', price: 120, name: 'Void' },
            't-sunset': { bg: '#ff7e5f', pipe: '#feb47b', price: 200, name: 'Sunset' }
        };

        // Physics
        const GRAVITY = 0.25;
        const FLAP = -4.6;
        let bird = { x: 50, y: 200, w: 34, h: 24, v: 0 };
        let pipes = [];
        let frame = 0;
        let gameActive = true;

        function initShop() {
            const bGrid = document.getElementById('bird-grid');
            const tGrid = document.getElementById('theme-grid');
            bGrid.innerHTML = ''; tGrid.innerHTML = '';

            Object.keys(birdSkins).forEach(id => {
                const isOwned = unlocked.includes(id);
                bGrid.innerHTML += `<div class="item ${activeBird === id ? 'active' : ''}" onclick="buyItem('${id}', 'bird')">
                    <div class="swatch" style="background:${birdSkins[id].color}"></div>
                    <span>${birdSkins[id].name}</span>
                    <small>${isOwned ? 'OWNED' : '⚙️' + birdSkins[id].price}</small>
                </div>`;
            });

            Object.keys(themes).forEach(id => {
                const isOwned = unlocked.includes(id);
                tGrid.innerHTML += `<div class="item ${activeTheme === id ? 'active' : ''}" onclick="buyItem('${id}', 'theme')">
                    <div class="swatch" style="background:${themes[id].bg}"></div>
                    <span>${themes[id].name}</span>
                    <small>${isOwned ? 'OWNED' : '⚙️' + themes[id].price}</small>
                </div>`;
            });
        }

        function buyItem(id, type) {
            const item = type === 'bird' ? birdSkins[id] : themes[id];
            if (unlocked.includes(id)) {
                if (type === 'bird') activeBird = id; else activeTheme = id;
            } else if (coins >= item.price) {
                coins -= item.price;
                unlocked.push(id);
                if (type === 'bird') activeBird = id; else activeTheme = id;
            } else {
                return alert("Need more gears!");
            }
            save();
            initShop();
            updateUI();
        }

        function save() {
            localStorage.setItem('birdCoins', coins);
            localStorage.setItem('birdUnlocked', JSON.stringify(unlocked));
            localStorage.setItem('birdActive', activeBird);
            localStorage.setItem('themeActive', activeTheme);
        }

        function drawBird() {
            ctx.save();
            ctx.translate(bird.x + bird.w/2, bird.y + bird.h/2);
            ctx.rotate(Math.min(Math.PI/4, Math.max(-Math.PI/4, bird.v * 0.1)));
            ctx.fillStyle = birdSkins[activeBird].color;
            ctx.beginPath();
            ctx.ellipse(0, 0, 17, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#000"; ctx.stroke();
            ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(10, -4, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "black"; ctx.beginPath(); ctx.arc(12, -4, 2, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        function draw() {
            if (!gameActive) return;
            const t = themes[activeTheme];
            ctx.fillStyle = t.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            bird.v += GRAVITY; bird.y += bird.v;
            if (frame % 90 === 0) pipes.push({ x: canvas.width, top: Math.random() * 200 + 50, passed: false });

            pipes.forEach((p, i) => {
                p.x -= 2;
                ctx.fillStyle = t.pipe;
                ctx.fillRect(p.x, 0, 50, p.top);
                ctx.fillRect(p.x, p.top + 130, 50, canvas.height);

                if (bird.x + bird.w > p.x && bird.x < p.x + 50 && (bird.y < p.top || bird.y + bird.h > p.top + 130)) endGame();
                if (p.x + 50 < bird.x && !p.passed) { score++; coins++; p.passed = true; updateUI(); }
            });

            if (bird.y + bird.h > canvas.height || bird.y < 0) endGame();
            drawBird();
            frame++;
            requestAnimationFrame(draw);
        }

        function endGame() {
            gameActive = false;
            if (score > highScore) { highScore = score; localStorage.setItem('birdHighScore', highScore); }
            save();
            document.getElementById('final-score').innerText = score;
            document.getElementById('high-score').innerText = highScore;
            document.getElementById('death-screen').classList.remove('hidden');
        }

        function toggleShop(show) {
            document.getElementById('shop-screen').classList.toggle('hidden', !show);
            if (show) initShop();
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function updateUI() {
            document.getElementById('coins').innerText = coins;
            document.getElementById('score-display').innerText = score;
        }

        function resetGame() {
            bird = { x: 50, y: 200, w: 34, h: 24, v: 0 };
            pipes = []; score = 0; frame = 0; gameActive = true;
            document.getElementById('death-screen').classList.add('hidden');
            updateUI(); draw();
        }

        window.addEventListener('keydown', (e) => { if(e.code === 'Space' && gameActive) bird.v = FLAP; });
        canvas.addEventListener('mousedown', () => { if(gameActive) bird.v = FLAP; });
        
        updateUI();
        draw();
    </script>
</body>
</html>
