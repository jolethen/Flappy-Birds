<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Aviator Workshop: Pro</title>
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div id="score-display">0</div>
            <div id="currency-wrapper">⚙️ <span id="coins">0</span></div>
            <button id="shop-open-btn" onclick="toggleShop(true)">🛠️ SHOP</button>
        </div>

        <div id="death-screen" class="overlay hidden">
            <h1 class="glitch">CRASHED</h1>
            <div class="stats">
                <p>SCORE: <span id="final-score">0</span></p>
                <p>BEST: <span id="high-score">0</span></p>
            </div>
            <button class="main-btn" onclick="resetGame()">REPAIR & FLY</button>
            <button class="sec-btn" onclick="toggleShop(true)">UPGRADE</button>
        </div>

        <div id="shop-screen" class="overlay hidden">
            <h2>THE WORKSHOP</h2>
            <div class="shop-tabs">
                <button onclick="showTab('tab-birds')">AVESTRUZ</button>
                <button onclick="showTab('tab-themes')">REGIONS</button>
            </div>

            <div id="tab-birds" class="tab-content">
                <div class="grid" id="bird-grid"></div>
            </div>
            <div id="tab-themes" class="tab-content hidden">
                <div class="grid" id="theme-grid"></div>
            </div>

            <button class="close-btn" onclick="toggleShop(false)">BACK TO HANGAR</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Persistent State
        let score = 0;
        let coins = parseInt(localStorage.getItem('birdCoins')) || 0;
        let highScore = parseInt(localStorage.getItem('birdHighScore')) || 0;
        let unlocked = JSON.parse(localStorage.getItem('birdUnlocked')) || ['b-classic', 't-classic'];
        let activeBird = localStorage.getItem('birdActive') || 'b-classic';
        let activeTheme = localStorage.getItem('themeActive') || 't-classic';

        // Configuration
        const birdSkins = {
            'b-classic': { color: '#f4d03f', wing: '#f1c40f', name: 'Yellow Jacket', price: 0 },
            'b-robotic': { color: '#bdc3c7', wing: '#95a5a6', name: 'Iron Wing', price: 50 },
            'b-stealth': { color: '#2c3e50', wing: '#1a252f', name: 'Nightshade', price: 100 },
            'b-gold': { color: '#f1c40f', wing: '#d4ac0d', name: 'Midas', price: 250 },
            'b-toxic': { color: '#2ecc71', wing: '#27ae60', name: 'Biohazard', price: 500 }
        };

        const themes = {
            't-classic': { bg: '#70c5ce', pipe: '#2ecc71', cloud: '#ffffff', name: 'Blue Skies', price: 0 },
            't-night': { bg: '#2c3e50', pipe: '#34495e', cloud: '#5d6d7e', name: 'Midnight', price: 100 },
            't-mars': { bg: '#e67e22', pipe: '#a04000', cloud: '#d35400', name: 'Red Planet', price: 200 },
            't-void': { bg: '#000000', pipe: '#4b0082', cloud: '#222', name: 'The Void', price: 400 },
            't-sunset': { bg: '#ff7e5f', pipe: '#feb47b', cloud: '#ffffff99', name: 'Horizon', price: 600 }
        };

        // Game Entities
        let bird = { x: 50, y: 300, w: 38, h: 26, v: 0, rotation: 0, wingY: 0 };
        let pipes = [];
        let particles = []; // Moving background elements
        let lastTime = 0;
        let pipeTimer = 0;
        let gameActive = true;

        function resize() {
            canvas.width = window.innerWidth > 600 ? window.innerHeight * 0.66 : window.innerWidth;
            canvas.height = window.innerHeight;
            bird.x = canvas.width * 0.15;
            // Generate initial particles for background depth
            particles = [];
            for(let i=0; i<8; i++) spawnParticle(true);
        }

        function spawnParticle(randomX = false) {
            particles.push({
                x: randomX ? Math.random() * canvas.width : canvas.width + 50,
                y: Math.random() * canvas.height * 0.6,
                size: Math.random() * 40 + 20,
                speed: Math.random() * 20 + 10
            });
        }

        const getGravity = () => canvas.height * 1.8;
        const getFlap = () => canvas.height * -0.42;
        const getPipeSpeed = () => canvas.width * 0.45;

        function drawBird() {
            ctx.save();
            ctx.translate(bird.x + bird.w/2, bird.y + bird.h/2);
            
            // Smooth Rotation
            let targetRot = Math.min(Math.PI/3, Math.max(-Math.PI/6, bird.v * 0.0018));
            bird.rotation += (targetRot - bird.rotation) * 0.12;
            ctx.rotate(bird.rotation);

            const skin = birdSkins[activeBird];
            
            // Body
            ctx.fillStyle = skin.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, 18, 13, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();

            // Wing (Animation)
            bird.wingY = Math.sin(Date.now() * 0.01) * 5;
            ctx.fillStyle = skin.wing;
            ctx.beginPath();
            ctx.ellipse(-8, bird.wingY, 10, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Beak
            ctx.fillStyle = "#e67e22";
            ctx.beginPath();
            ctx.moveTo(15, -2); ctx.lineTo(25, 2); ctx.lineTo(15, 6);
            ctx.fill();
            ctx.stroke();

            // Eye
            ctx.fillStyle = "white";
            ctx.beginPath(); ctx.arc(10, -5, 5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "black";
            ctx.beginPath(); ctx.arc(12, -5, 2.5, 0, Math.PI*2); ctx.fill();

            ctx.restore();
        }

        function update(dt) {
            if (!gameActive) return;

            bird.v += getGravity() * dt;
            bird.y += bird.v * dt;

            // Background Parallax update
            particles.forEach(p => {
                p.x -= p.speed * dt;
                if (p.x < -100) {
                    particles.splice(particles.indexOf(p), 1);
                    spawnParticle();
                }
            });

            pipeTimer += dt;
            if (pipeTimer > 1.4) {
                const gap = canvas.height * 0.26;
                const top = Math.random() * (canvas.height - gap - 200) + 100;
                pipes.push({ x: canvas.width, top: top, gap: gap, passed: false });
                pipeTimer = 0;
            }

            const pWidth = canvas.width * 0.18;
            pipes.forEach((p, i) => {
                p.x -= getPipeSpeed() * dt;
                // Collision
                if (bird.x + 25 > p.x && bird.x < p.x + pWidth && (bird.y < p.top || bird.y + bird.h > p.top + p.gap)) endGame();
                // Score
                if (p.x + pWidth < bird.x && !p.passed) { score++; coins += 5; p.passed = true; updateUI(); }
            });

            if (bird.y + bird.h > canvas.height || bird.y < 0) endGame();
            if (pipes.length > 0 && pipes[0].x < -pWidth) pipes.shift();
        }

        function loop(timestamp) {
            let dt = (timestamp - lastTime) / 1000;
            if (dt > 0.1) dt = 0;
            lastTime = timestamp;

            update(dt);

            const t = themes[activeTheme];
            ctx.fillStyle = t.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Background Elements
            ctx.fillStyle = t.cloud + "55"; // Semi-transparent
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            });

            const pWidth = canvas.width * 0.18;
            pipes.forEach(p => {
                ctx.fillStyle = t.pipe;
                ctx.fillRect(p.x, 0, pWidth, p.top);
                ctx.fillRect(p.x, p.top + p.gap, pWidth, canvas.height);
                // Pipe Cap Deco
                ctx.fillStyle = "rgba(0,0,0,0.2)";
                ctx.fillRect(p.x, p.top - 20, pWidth, 20);
                ctx.fillRect(p.x, p.top + p.gap, pWidth, 20);
            });

            drawBird();
            requestAnimationFrame(loop);
        }

        // Shop & UI Logic (Enhanced)
        function initShop() {
            const bGrid = document.getElementById('bird-grid');
            const tGrid = document.getElementById('theme-grid');
            bGrid.innerHTML = ''; tGrid.innerHTML = '';

            Object.entries(birdSkins).forEach(([id, data]) => {
                const owned = unlocked.includes(id);
                bGrid.innerHTML += `
                    <div class="item ${activeBird === id ? 'active' : ''}" onclick="buyItem('${id}', 'bird')">
                        <div class="swatch" style="background:${data.color}"></div>
                        <div class="item-name">${data.name}</div>
                        <div class="price-tag">${owned ? 'OWNED' : '⚙️ ' + data.price}</div>
                    </div>`;
            });

            Object.entries(themes).forEach(([id, data]) => {
                const owned = unlocked.includes(id);
                tGrid.innerHTML += `
                    <div class="item ${activeTheme === id ? 'active' : ''}" onclick="buyItem('${id}', 'theme')">
                        <div class="swatch" style="background:${data.bg}"></div>
                        <div class="item-name">${data.name}</div>
                        <div class="price-tag">${owned ? 'OWNED' : '⚙️ ' + data.price}</div>
                    </div>`;
            });
        }

        function buyItem(id, type) {
            const data = type === 'bird' ? birdSkins[id] : themes[id];
            if (unlocked.includes(id)) {
                if (type === 'bird') activeBird = id; else activeTheme = id;
            } else if (coins >= data.price) {
                coins -= data.price;
                unlocked.push(id);
                if (type === 'bird') activeBird = id; else activeTheme = id;
            } else return alert("NOT ENOUGH GEARS!");
            save(); initShop(); updateUI();
        }

        function save() {
            localStorage.setItem('birdCoins', coins);
            localStorage.setItem('birdUnlocked', JSON.stringify(unlocked));
            localStorage.setItem('birdActive', activeBird);
            localStorage.setItem('themeActive', activeTheme);
        }

        function endGame() {
            if (!gameActive) return;
            gameActive = false;
            if (score > highScore) { highScore = score; localStorage.setItem('birdHighScore', highScore); }
            save();
            document.getElementById('final-score').innerText = score;
            document.getElementById('high-score').innerText = highScore;
            document.getElementById('death-screen').classList.remove('hidden');
        }

        function resetGame() {
            bird.y = canvas.height / 2; bird.v = 0; bird.rotation = 0;
            pipes = []; score = 0; pipeTimer = 0; gameActive = true;
            document.getElementById('death-screen').classList.add('hidden');
            updateUI();
        }

        function toggleShop(show) {
            document.getElementById('shop-screen').classList.toggle('hidden', !show);
            if (show) initShop();
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function updateUI() {
            document.getElementById('coins').innerText = coins;
            document.getElementById('score-display').innerText = score;
        }

        const flap = () => { if(gameActive) bird.v = getFlap(); };
        window.addEventListener('keydown', (e) => { if(e.code === 'Space') flap(); });
        canvas.addEventListener('mousedown', flap);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); }, {passive: false});
        window.addEventListener('resize', resize);

        resize();
        updateUI();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
