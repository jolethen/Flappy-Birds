<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steampunk Flap</title>
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="320" height="480"></canvas>
        
        <div id="ui-layer">
            <div id="score-display">0</div>
            <div id="currency-display">⚙️ <span id="coins">0</span></div>
        </div>

        <div id="death-screen" class="hidden">
            <h1>CRASHED!</h1>
            <p>Score: <span id="final-score">0</span></p>
            <p>Best: <span id="high-score">0</span></p>
            <button onclick="resetGame()">REPAIR & FLY</button>
            <div class="shop">
                <h3>Workshop</h3>
                <button onclick="buyTheme('classic')">Default</button>
                <button onclick="buyTheme('midnight')">Midnight (50 ⚙️)</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // State & Local Storage
        let score = 0;
        let coins = parseInt(localStorage.getItem('birdCoins')) || 0;
        let highScore = parseInt(localStorage.getItem('birdHighScore')) || 0;
        let currentTheme = localStorage.getItem('birdTheme') || 'classic';

        const themes = {
            classic: { bg: '#70c5ce', pipe: '#2ecc71', bird: '#f4d03f' },
            midnight: { bg: '#2c3e50', pipe: '#95a5a6', bird: '#e74c3c' }
        };

        // Physics Constants
        const GRAVITY = 0.25;
        const FLAP = -4.8;
        let bird = { x: 50, y: 200, w: 34, h: 24, v: 0, rotation: 0 };
        let pipes = [];
        let frame = 0;
        let gameActive = true;

        function updateUI() {
            document.getElementById('coins').innerText = coins;
            document.getElementById('score-display').innerText = score;
        }

        function drawBird() {
            ctx.save();
            ctx.translate(bird.x + bird.w/2, bird.y + bird.h/2);
            // Tilt bird based on velocity
            bird.rotation = Math.min(Math.PI/4, Math.max(-Math.PI/4, bird.v * 0.1));
            ctx.rotate(bird.rotation);
            
            // Draw Bird Body (The "Persona": An aviator bird)
            ctx.fillStyle = themes[currentTheme].bird;
            ctx.beginPath();
            ctx.ellipse(0, 0, 17, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.stroke();

            // Eye (facing right)
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(8, -4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "black";
            ctx.beginPath();
            ctx.arc(10, -4, 2, 0, Math.PI * 2);
            ctx.fill();

            // Wing
            ctx.fillStyle = "rgba(255,255,255,0.6)";
            ctx.fillRect(-10, 0, 12, 8);
            
            ctx.restore();
        }

        function draw() {
            if (!gameActive) return;

            ctx.fillStyle = themes[currentTheme].bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            bird.v += GRAVITY;
            bird.y += bird.v;

            if (frame % 100 === 0) {
                let h = Math.random() * (canvas.height - 250) + 50;
                pipes.push({ x: canvas.width, top: h, passed: false });
            }

            pipes.forEach((p, i) => {
                p.x -= 2;
                ctx.fillStyle = themes[currentTheme].pipe;
                ctx.fillRect(p.x, 0, 50, p.top);
                ctx.fillRect(p.x, p.top + 120, 50, canvas.height);

                if (bird.x + bird.w > p.x && bird.x < p.x + 50 && (bird.y < p.top || bird.y + bird.h > p.top + 120)) {
                    endGame();
                }

                if (p.x + 50 < bird.x && !p.passed) {
                    score++;
                    coins += 1; // Earn currency per pipe
                    p.passed = true;
                    updateUI();
                }
            });

            if (bird.y + bird.h > canvas.height || bird.y < 0) endGame();

            drawBird();
            frame++;
            requestAnimationFrame(draw);
        }

        function endGame() {
            gameActive = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('birdHighScore', highScore);
            }
            localStorage.setItem('birdCoins', coins);
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('high-score').innerText = highScore;
            document.getElementById('death-screen').classList.remove('hidden');
        }

        function resetGame() {
            bird = { x: 50, y: 200, w: 34, h: 24, v: 0, rotation: 0 };
            pipes = [];
            score = 0;
            gameActive = true;
            document.getElementById('death-screen').classList.add('hidden');
            updateUI();
            draw();
        }

        function buyTheme(name) {
            if (name === 'midnight' && coins < 50 && currentTheme !== 'midnight') {
                alert("Not enough Gears!");
                return;
            }
            if (name === 'midnight' && currentTheme !== 'midnight') coins -= 50;
            currentTheme = name;
            localStorage.setItem('birdTheme', name);
            localStorage.setItem('birdCoins', coins);
            updateUI();
        }

        window.addEventListener('keydown', (e) => { if(e.code === 'Space') bird.v = FLAP; });
        canvas.addEventListener('mousedown', () => bird.v = FLAP);
        
        updateUI();
        draw();
    </script>
</body>
</html>
